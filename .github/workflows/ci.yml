# Quy trình CI tự động kiểm tra typecheck và build production cho Frontend Web khi deploy lên main
name: Frontend Web CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install --legacy-peer-deps --prefer-offline --no-audit

      - name: Production Build
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=5120"
          NEXT_PUBLIC_API_BASE_URL: https://api.lingosphere.io.vn
          NEXT_PUBLIC_ADMIN_WEB_URL: https://admin.lingosphere.io.vn
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 790440593251-u1ht6t39hocf2qh6hncngudn8gm4sl19.apps.googleusercontent.com
